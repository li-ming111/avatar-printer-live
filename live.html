<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>头像打印直播 · 1080×1920</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318}#frame{position:absolute;width:1080px;height:1920px;transform-origin:top left;background:#161b20}#scene{position:absolute;inset:0}canvas{display:block;width:1080px!important;height:1920px!important}#rules{position:absolute;right:30px;top:100px;width:420px;pointer-events:none}#label{position:absolute;top:30px;left:36px;color:white;font:700 26px 'Microsoft YaHei';text-shadow:0 2px 5px #000}#waiting{color:#fff;padding:40px;font:24px sans-serif}</style><link rel="stylesheet" href="assets/live-rules.css"></head><body><div id="frame"><div id="scene"><div id="waiting">正在接入主窗口直播画面…</div></div><div id="label">头像打印小屋</div><div id="rules"><div class="live-rules" aria-label="评论888打印一张小图，关注一张大头像，小心心三张，啤酒一张，玫瑰十张，棒棒糖九十九张大头像"><div class="rule-row comment-rule"><b>评论 888</b><span>打印一张小图</span></div><div class="rule-row"><span>关注</span><span>大头像 ×1</span></div><div class="rule-row"><img src="assets/generated/original-icons/heart.png" alt="小心心"><span>大头像 ×3</span></div><div class="rule-row"><img src="assets/generated/original-icons/beer.png" alt="啤酒"><span>大头像 ×1</span></div><div class="rule-row"><img src="assets/generated/original-icons/rose.png" alt="玫瑰"><span>大头像 ×10</span></div><div class="rule-row"><img src="assets/generated/original-icons/lollipop.png" alt="棒棒糖"><span>大头像 ×99</span></div></div></div></div><script>function fit(){const scale=Math.min(innerWidth/1080,innerHeight/1920);const f=document.getElementById('frame');f.style.transform='scale('+scale+')';f.style.left=(innerWidth-1080*scale)/2+'px';f.style.top=(innerHeight-1920*scale)/2+'px'}addEventListener('resize',fit);fit();</script></body></html>
